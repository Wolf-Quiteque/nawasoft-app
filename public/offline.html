<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sem ligação · NAWASOFT</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbf3e7;
        --fg: #2b1d10;
        --muted: #6b5946;
        --primary: #c1571f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #241608;
          --fg: #f4eadd;
          --muted: #b09a83;
          --primary: #e0763c;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 2rem 1.5rem;
        text-align: center;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }
      .mark {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 4rem;
        height: 4rem;
        border-radius: 1.1rem;
        background: linear-gradient(135deg, #e8a33d 0%, #c1571f 55%, #a8401c 100%);
        color: #fff;
        font-size: 1.75rem;
        font-weight: 900;
      }
      h1 {
        margin: 0.5rem 0 0;
        font-size: 1.25rem;
        font-weight: 800;
      }
      p {
        margin: 0;
        max-width: 22rem;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
      }
      button {
        margin-top: 0.75rem;
        padding: 0.7rem 1.4rem;
        border: 0;
        border-radius: 1rem;
        background: var(--primary);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="mark">N</div>
    <h1>Sem ligação</h1>
    <p>
      O NAWASOFT precisa de internet para mostrar bilhetes e viagens atualizados.
      Verifique a ligação e tente novamente.
    </p>
    <button onclick="location.reload()">Tentar novamente</button>
  </body>
</html>
